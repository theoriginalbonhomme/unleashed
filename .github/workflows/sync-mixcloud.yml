name: Sync Mixcloud

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-mixcloud
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-mixcloud.mjs
      - name: Commit new uploads and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/releases.json; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "Sync new Mixcloud uploads"
          git push
          gh workflow run deploy-pages.yml --ref main
